; 从项目根目录运行：supervisord -c supervisord.split.conf
; 使用应用运行账号，先构建 bin/dawn-simple 并创建 storage/logs。
[unix_http_server]
file=%(here)s/storage/supervisor-split.sock
chmod=0700

[supervisord]
logfile=%(here)s/storage/logs/supervisor-split.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=%(here)s/storage/supervisord-split.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/storage/supervisor-split.sock

[program:dawn-http]
directory=%(here)s
command=%(here)s/bin/dawn-simple dawn:start http
environment=DAWN_RUNTIME_DIRECTORY="storage/framework/http"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=%(here)s/storage/logs/http.log

[program:dawn-ws]
directory=%(here)s
command=%(here)s/bin/dawn-simple dawn:start ws
environment=DAWN_RUNTIME_DIRECTORY="storage/framework/ws"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=%(here)s/storage/logs/ws.log

[program:dawn-horizon]
directory=%(here)s
command=%(here)s/bin/dawn-simple dawn:start horizon
environment=DAWN_RUNTIME_DIRECTORY="storage/framework/horizon"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=%(here)s/storage/logs/horizon.log

[program:dawn-cron]
directory=%(here)s
command=%(here)s/bin/dawn-simple dawn:start cron
environment=DAWN_RUNTIME_DIRECTORY="storage/framework/cron"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=%(here)s/storage/logs/cron.log

[group:dawn-simple]
programs=dawn-http,dawn-ws,dawn-horizon,dawn-cron
