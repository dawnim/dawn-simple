; 从项目根目录运行：supervisord -c supervisord.conf
; 使用应用运行账号，先构建 bin/dawn-simple 并创建 storage/logs。
[unix_http_server]
file=%(here)s/storage/supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/storage/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=%(here)s/storage/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/storage/supervisor.sock

[program:dawn-app]
directory=%(here)s
command="%(here)s/bin/dawn-simple" dawn:start all
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=%(here)s/storage/logs/process.log

[group:dawn-simple]
programs=dawn-app
